name: Build resume

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: pip install "rendercv[full]==2.8"

      - name: Render Russian CV
        run: rendercv render resume-ru.yaml --dont-generate-html --dont-generate-png --dont-generate-markdown

      - name: Render English CV
        run: rendercv render resume-en.yaml --dont-generate-html --dont-generate-png --dont-generate-markdown

      - name: Collect PDFs
        run: |
          mkdir -p out
          cp rendercv_output/*.pdf out/
          # Rename to stable names expected by docs/index.html and release assets
          mv "out/Борис_Рябов_CV.pdf" out/resume-ru.pdf
          mv "out/Boris_Ryabov_CV.pdf" out/resume-en.pdf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: out

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: resume

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: resume-${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            resume-ru.pdf
            resume-en.pdf

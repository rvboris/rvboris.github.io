      - "Shape strategy, architecture, and delivery for products and platforms across 15+ teams; build engineering organizations, reliability, and business–engineering alignment."
    Skills:
      - "Leadership: strategy and roadmaps, team development, career paths, performance reviews, cross-functional alignment."
      - "Platform and architecture: frontend platforms, design systems, Node.js, React, APIs, Kubernetes, CI/CD."
      - "Quality and reliability: T2M and engineering metrics, technical debt, SSDLC, supply-chain security, observability, and performance."
    Experience:
      - company: YooMoney (ex Yandex.Money)

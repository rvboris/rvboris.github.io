          - "Strategy, architecture, roadmaps, resources, and risks across 15+ product and platform teams."
          - "F-Platform, design system, full-stack platform APIs, Node.js, React, CI, and internal tooling."
          - "Delivery metrics, technical debt, documentation, and the lifecycle of code, tests, and dependencies."
          - "Kubernetes, performance, observability, load resilience, SSDLC, and software supply-chain security."
          - "People organization: competencies, career paths, performance reviews, onboarding, and cross-functional alignment."
          - "#v(0.5em) **Key results:**"
          - "Built a delivery operating model with unified documentation and CI HealthCheck: 90th-percentile T2M reached 3.62 days; build, review, and release took 1.01, 0.76, and 0.24 days."
          - "Defined the F-Platform scope, goals, and roadmap, aligning platform initiatives with product-team needs."
          - "Shaped a modernization program from legacy audits: component extraction plans, Kubernetes migration, GitHub Flow, SSR, and dependency management."
          - "Implemented layered quality and security practices: SonarQube influence on merge decisions, dependency control, CodeQL and Semgrep pilots, CSP, and OWASP; ESLint Healthcheck improved from 2.62 to 3.47."
          - "Resolved DDoS and cascading restart incidents through autoscaling and Kubernetes; strengthened observability and performance with bundle budgets, Web Vitals, and LCP."
          - "Advanced organizational practices through competencies, career paths, roles, reviews, onboarding, and talent reallocation; established a department AI harness with a corporate shared LLM gateway, secure-use governance, employee training, and reusable OpenCode/LiteLLM skills—regular AI use reached 30% of the department within three months."

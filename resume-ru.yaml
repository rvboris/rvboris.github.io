cv:
  name: Борис Рябов
  headline: Руководитель отдела фронтенд-разработки
  location: Санкт-Петербург, Россия
  email: rvboris@mail.ru
  social_networks:
    - network: GitHub
      username: rvboris
    - network: LinkedIn
      username: rvboris
  sections:
    Обо мне:
      - Более 15 лет в ИТ-индустрии; прошел путь от разработчика до руководителя отдела, управлял командами численностью до 50 человек.
      - Налаживаю процессы разработки, координирую работу над крупными проектами, работаю с техдолгом, выстраиваю взаимодействие бизнеса и разработки, оцениваю и устраняю риски.
    Опыт работы:
      - company: YooMoney (ex Яндекс.Деньги)
        position: Руководитель отдела фронтенд разработки
        start_date: 2021-09
        end_date: present
        location: Санкт-Петербург, Россия
        highlights:
          - "#v(0.5em) **Зоны ответственности и экспертизы:**"
          - "Стратегия, архитектура, дорожные карты, ресурсы и риски для 15+ продуктовых и платформенных команд."
          - "F-Platform, дизайн-система, full-stack платформенные API, Node.js, React, CI и внутренние инструменты."
          - "Метрики поставки, техдолг, документация, жизненный цикл кода, тестов и зависимостей."
          - "Kubernetes, производительность, наблюдаемость, устойчивость к нагрузке, SSDLC и безопасность цепочки поставки."
          - "Организация людей: компетенции, карьерные треки, performance review, адаптация и кросс-функциональное взаимодействие."
          - "#v(0.5em) **Ключевые результаты:**"
          - "Операционная модель поставки: 90-й перцентиль T2M — 3,62 дня; сборка, ревью и релиз — 1,01 / 0,76 / 0,24 дня; единые документация и CI HealthCheck."
          - "Определил границы, цели и дорожную карту F-Platform."
          - "Сформировал программу модернизации: аудит legacy, планы выделения компонентов, Kubernetes, GitHub Flow, SSR и управление зависимостями."
          - "Многоуровневое качество и безопасность: влияние SonarQube на merge, проверки зависимостей, пилоты CodeQL и Semgrep, CSP и OWASP; ESLint Healthcheck вырос с 2,62 до 3,47."
          - "Повысил устойчивость и наблюдаемость сервисов: DDoS и каскадные рестарты, автоскейлинг, bundle budgets, Web Vitals и LCP."
          - "Повысил организационную зрелость через компетенции, карьерные треки, роли, review, адаптацию и перераспределение экспертизы; развил AI-практики с OpenCode, LiteLLM, агентами и навыками."
      - company: YooMoney (ex Яндекс.Деньги)
        position: Ведущий программист
        start_date: 2020-10
        end_date: 2021-09
        location: Санкт-Петербург, Россия
        highlights:
          - "#v(0.5em) **Задачи:**"
          - Разработка бизнес функциональности в продуктовой команде
          - Проведение рефакторинга и оптимизаций кода
          - Срочный анализ и исправление ошибок
          - Проведение код ревью внутри команды и за ее пределами
          - Проведение performance review для членов команды
          - Проведение тех. интервью для кандидатов
          - "#v(0.5em) **Достижения:**"
          - Инициировал и провел рефакторинг бизнес процесса денежных переводов на новый стек технологий
          - Участвовал в создании продукта для самозанятых с 0
          - Составил план работы с тех. долгом, наладил процесс работы с ним в команде
          - "#v(0.5em) **Стек:** nodejs, nest.js, react, redux, styled-components, jest"
      - company: Яндекс.Деньги
        position: Старший программист
        start_date: 2018-07
        end_date: 2020-10
        location: Санкт-Петербург, Россия
        highlights:
          - "#v(0.5em) **Задачи:**"
          - Разработка бизнес функциональности в B2C направлении — денежные переводы
          - Проведение рефакторинга и оптимизаций кода
          - Проведение код ревью внутри команды и за ее пределами
          - Адаптация для новичков
          - "#v(0.5em) **Достижения:**"
          - Переписал один из высоконагруженных бизнес процессов с xscript на nodejs (4k+ RPM)
          - Провел рефакторинг кода на typescript
          - Выработал рекомендации для оценки задач внутри команды
      - company: Яндекс.Деньги
        position: Программист
        start_date: 2015-10
        end_date: 2018-07
        location: Санкт-Петербург, Россия
        highlights:
          - Разработка и сопровождение процессов жизненного цикла карт Яндекс.Денег
          - Работа с легаси кодом (XScript, XSLT, XML), переход к nodejs
      - company: E-Citrus
        position: Ведущий фронтенд разработчик
        start_date: 2014-05
        end_date: 2015-10
        location: Санкт-Петербург, Россия
        highlights:
          - "#v(0.5em) **Задачи:**"
          - Разработка десктоп приложения на технологиях node-webkit
          - Разработка сервера пост-обработки видео на nodejs
          - Оптимизация интерфейсов для уличных POS терминалов
          - Подбор и проведение тех. интервью сотрудников в команду
          - Формирование документации и технических регламентов
          - "#v(0.5em) **Достижения:**"
          - Разработал модули управления шаговыми двигателями и LED панелями
          - Создал модульную систему подключения оборудования и протокол их взаимодействия через websockets
          - Разработал платформу автоматизированной видео и фото съемки на фотоаппараты Canon
          - "#v(0.5em) **Стек:** nodejs, С#, C++, FTDI, DMX512, websockets, angular"
      - company: E-Citrus
        position: Фронтенд разработчик
        start_date: 2012-09
        end_date: 2014-05
        location: Санкт-Петербург, Россия
        highlights:
          - "#v(0.5em) **Задачи:**"
          - Разработка и поддержка сервиса виртуальной примерочной
          - Разработка встраиваемых решений (js-виджеты)
          - Разработка и поддержка социальных приложений Facebook, VK
          - "#v(0.5em) **Достижения:**"
          - Переписал клиентскую часть сервиса виртуальной примерочной за 2 месяца на angular
      - company: Университет ENGECON
        position: Программист
        start_date: 2009-08
        end_date: 2012-09
        location: Санкт-Петербург, Россия
        highlights:
          - Доработка и поддержка CMS Moodle
          - Разработка приложения для предоставления электронных учебных пособий (C#)
          - Автоматизация процесса создания электронных учебных пособий (AutoIt)

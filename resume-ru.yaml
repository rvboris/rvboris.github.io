cv:
  name: Борис Рябов
  headline: Руководитель отдела фронтенд-разработки
  location: Санкт-Петербург, Россия
  email: rvboris@mail.ru
  social_networks:
    - network: GitHub
      username: rvboris
    - network: LinkedIn
      username: rvboris
  sections:
    Обо мне:
      - "Руководитель фронтенд- и платформенной разработки с 15+ годами опыта: вырос от разработчика до руководителя, управлял командами численностью до 50 человек."
      - "Веду ИИ-трансформацию фронтенд-отдела. Выстраиваю стратегию, архитектуру и поставку совместно с 15+ командами; развиваю людей, надежность и взаимодействие бизнеса с разработкой."
    Навыки:
      - "Лидерство: стратегия и дорожные карты, развитие команд, карьерные треки, performance review, кросс-функциональное взаимодействие."
      - "Платформа и архитектура: фронтенд-платформы, дизайн-системы, Node.js, React, API, Kubernetes, CI/CD."
      - "Качество и надежность: T2M и инженерные метрики, техдолг, SSDLC, supply-chain security, наблюдаемость и производительность."
      - "ИИ в разработке: AI-assisted workflows, общий агентный контур, LLM-шлюз, рабочие регламенты и безопасность, обучение."
    Опыт работы:
      - company: YooMoney (ex Яндекс.Деньги)
        position: Руководитель отдела фронтенд разработки
        start_date: 2021-09
        end_date: present
        location: Санкт-Петербург, Россия
        highlights:
          - "#v(0.5em) **Зоны ответственности и экспертизы:**"
          - "Стратегия, архитектура, дорожные карты, ресурсы и риски во взаимодействии с 15+ продуктовыми и платформенными командами."
          - "F-Platform, дизайн-система, full-stack платформенные API, Node.js, React, CI и внутренние инструменты."
          - "Метрики поставки, техдолг, документация, жизненный цикл кода, тестов и зависимостей."
          - "Kubernetes, производительность, наблюдаемость, устойчивость к нагрузке, SSDLC и безопасность цепочки поставки."
          - "Организация людей: компетенции, карьерные треки, performance review, адаптация и кросс-функциональное взаимодействие."
          - "Принимал решения о найме и увольнении сотрудников, оптимизировал численность отдела и распределение нагрузки в соответствии с потребностями разработки."
          - "#v(0.5em) **Ключевые результаты:**"
          - "Организовал общий агентный контур для отдела и более широкого подразделения, единые рабочие регламенты, правила безопасности и обучение сотрудников. За три месяца доля задач отдела, выполняемых с помощью ИИ, достигла 30%."
          - "Организовал внедрение общего корпоративного LLM-шлюза и стандартизировал инструменты: OpenCode, LiteLLM, общие инструкции для агентов и переиспользуемые навыки."
          - "Выстроил управление поставкой на основе инженерных метрик, единых стандартов документации и CI, выявления и устранения узких мест."
          - "Согласовал границы, цели и дорожную карту F-Platform с потребностями продуктовых команд. По итогам аудита legacy сформировал программу модернизации: планы выделения компонентов, миграция на Kubernetes, GitHub Flow, SSR и управление зависимостями."
          - "Внедрил практики качества и безопасности: учет SonarQube при слиянии кода, контроль зависимостей, пилоты CodeQL и Semgrep, CSP и обучение OWASP."
          - "Организовал устранение каскадных рестартов при DDoS-нагрузке и развитие мониторинга производительности сервисов."
          - "Развил организационные практики: компетенции, карьерные треки, роли, performance review, адаптацию и перераспределение специалистов между командами."
          - "Организовал переход отдела на новый режим работы и реализовал меры по снижению рисков, связанных с работой сотрудников из-за рубежа."
      - company: YooMoney (ex Яндекс.Деньги)
        position: Ведущий программист
        start_date: 2020-10
        end_date: 2021-09
        location: Санкт-Петербург, Россия
        highlights:
          - Инициировал перевод процесса денежных переводов на новый технологический стек, участвовал в запуске продукта для самозанятых и выстроил работу с техдолгом.
      - company: Яндекс.Деньги
        position: Старший программист
        start_date: 2018-07
        end_date: 2020-10
        location: Санкт-Петербург, Россия
        highlights:
          - "Переписал высоконагруженный процесс денежных переводов с xscript на Node.js: 4 000 RPM (~67 RPS); перевел значимую часть кодовой базы на TypeScript."
      - company: Яндекс.Деньги
        position: Программист
        start_date: 2015-10
        end_date: 2018-07
        location: Санкт-Петербург, Россия
        highlights:
          - Разработка и сопровождение процессов жизненного цикла карт Яндекс.Денег
          - Работа с легаси кодом (XScript, XSLT, XML), переход к nodejs
      - company: E-Citrus
        position: Ведущий фронтенд разработчик
        start_date: 2014-05
        end_date: 2015-10
        location: Санкт-Петербург, Россия
        highlights:
          - "Создал модульную систему подключения оборудования по WebSocket и платформу автоматизированной фото- и видеосъемки на камеры Canon."
      - company: E-Citrus
        position: Фронтенд разработчик
        start_date: 2012-09
        end_date: 2014-05
        location: Санкт-Петербург, Россия
        highlights:
          - "#v(0.5em) **Задачи:**"
          - Разработка и поддержка сервиса виртуальной примерочной
          - Разработка встраиваемых решений (js-виджеты)
          - Разработка и поддержка социальных приложений Facebook, VK
          - "#v(0.5em) **Достижения:**"
          - Переписал клиентскую часть сервиса виртуальной примерочной за 2 месяца на angular
      - company: Университет ENGECON
        position: Программист
        start_date: 2009-08
        end_date: 2012-09
        location: Санкт-Петербург, Россия
        highlights:
          - Доработка и поддержка CMS Moodle
          - Разработка приложения для предоставления электронных учебных пособий (C#)
          - Автоматизация процесса создания электронных учебных пособий (AutoIt)
    Образование:
      - institution: Государственный университет аэрокосмического приборостроения
        area: Программное обеспечение вычислительной техники и автоматизированных систем
        degree: Средне-специальное
        start_date: 2005-09
        end_date: 2009-06
        location: Санкт-Петербург, Россия

